<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LeakX — Login</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Roboto',system-ui,sans-serif;background:#0e1110;color:#edf2ee;min-height:100vh;display:grid;place-items:center;padding:20px}.box{width:min(430px,100%);background:#151a17;border:1px solid #303a34;padding:30px;border-radius:14px}.logo{font-weight:900;font-size:28px;letter-spacing:2px}.logo span{color:#62a66e}.sub{color:#8e9a91;margin:7px 0 25px;font-size:14px;line-height:1.5}label{display:block;font-size:13px;font-weight:700;margin:14px 0 7px}input{width:100%;padding:12px;border:1px solid #3b463f;background:#0f1311;color:#fff;border-radius:8px;font:inherit}button{width:100%;margin-top:20px;padding:13px;background:#62a66e;border:0;border-radius:8px;color:#0c130e;font-weight:900;cursor:pointer}.error{display:none;margin-top:15px;padding:10px;border-radius:7px;background:#3a1c18;color:#f2a093;font-size:13px}.hint{margin-top:20px;padding:12px;border:1px solid #29332e;color:#8e9a91;font-size:11px;line-height:1.6}.back{display:block;text-align:center;color:#8e9a91;margin-top:18px;text-decoration:none;font-size:13px}
</style><link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body><div class="box"><div class="logo">LEAK<span>X</span></div><p class="sub">Sign in to use LeakX. Customers can submit leak reports. Administrators can monitor the system, review reports, and control valves.</p>
<form id="loginForm"><label>Username</label><input name="username" autocomplete="username" required><label>Password</label><input name="password" type="password" autocomplete="current-password" required><button id="btn">Sign in</button></form><div id="error" class="error"></div><div class="hint"><b>Hackathon demo accounts</b><br>Admin: admin / admin123<br>Customer: customer / customer123</div><a class="back" href="/">← Back to LeakX home</a></div>
<script>const f=document.getElementById("loginForm"),b=document.getElementById("btn"),e=document.getElementById("error");f.addEventListener("submit",async ev=>{ev.preventDefault();b.disabled=true;b.textContent="Signing in…";e.style.display="none";try{const r=await fetch("/login",{method:"POST",body:new FormData(f)});const d=await r.json();if(!r.ok)throw new Error(d.detail||"Login failed");location.href=d.redirect}catch(x){e.textContent=x.message;e.style.display="block"}finally{b.disabled=false;b.textContent="Sign in"}});</script></body></html>
